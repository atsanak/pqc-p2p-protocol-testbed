# P2P hybrid-TLS front door(s) -- TWO sections, ONE process (own pidfile below covers both): [p2p-pqc]
# (`pqkex`, :9444, server-auth only) and [p2p-pqc-mutual] (`pqkex-mutual`, :9447, `verify = 2` --
# Stack 2, mutual PQC TLS). Both front the SAME existing P2P plaintext `http` tech listener (:8442,
# no TLS at all) with a real PQC/hybrid TLS 1.3 handshake, same shape as
# ../gateway/stunnel-pqc.conf (see that file's header for why stunnel over nginx, why the private
# OpenSSL 3.4 build, why `stack = 4194304`, why `ciphers = DEFAULT@SECLEVEL=0`).
#
# Deliberately NOT fronting :8443 (mtls/pqc) or :8444 (https): both of those already terminate TLS
# themselves in Python, so a second TLS layer in front would double-wrap, not upgrade them. :8442 is
# the one plaintext backend here, exactly like the gateway's :8081 -- this is the same "reverse
# proxy in front of an untouched plaintext service" pattern, just pointed at a different backend.
#
# Runs as its own process (own pidfile/logs), NOT any distro stunnel service, NOT referenced by
# node-agent's bundle apply. The real P2P receiver (receiver-role/server.py, all of :8442/8443/8444)
# is untouched underneath -- classical mtls/https/pqc/coap/coap-enc all keep working exactly as
# before; this only adds a new, additional path into the SAME plaintext listener.
#
# Launch (see run-p2p-proxy.sh):
#   LD_LIBRARY_PATH=/opt/pqc-libs/openssl-priv/lib64 OPENSSL_CONF=/opt/PQC-bench/oqs-openssl-priv.cnf \
#       stunnel /opt/PQC-bench/p2p-proxy/p2p-pqc-proxy.conf
#
# Prove the handshake (offering ONLY the hybrid group -- no fallback -- so a successful handshake
# unambiguously proves that group was what got negotiated, same methodology as
# pqc-readiness-migration-plan.md Phase 1's gate):
#   LD_LIBRARY_PATH=/opt/pqc-libs/openssl-priv/lib64 OPENSSL_CONF=/opt/PQC-bench/oqs-openssl-priv.cnf \
#       /opt/pqc-libs/openssl-priv/bin/openssl s_client -connect <box-ip>:9444 \
#       -groups X25519MLKEM768 -tls1_3 -CAfile /var/lib/p2p/certs-pqc/ca.crt -brief </dev/null

pid = /opt/PQC-bench/p2p-proxy/run/stunnel-p2p-pqc.pid
output = /opt/PQC-bench/p2p-proxy/logs/stunnel.log
foreground = no
sslVersion = TLSv1.3
; see stunnel-pqc.conf's comment -- liboqs's ML-DSA-65 code needs a bigger per-connection stack
; than stunnel's default, or it segfaults on the first real handshake.
stack = 4194304

; 2026-10-23: each section forwards to its OWN loopback listener of receiver-role/server.py (FRONTED_BACKENDS), so the
; receiver can log the real tech (pqkex / pqkex-mutual / hybrid / hybrid-mutual) instead of `http`. A node whose server.py predates this
; must keep `connect = 127.0.0.1:8442` -- deploy server.py first.
[p2p-pqc]
accept = 9444
connect = 127.0.0.1:8452
; this box's own leaf, exactly as provision-pqc.sh installs it -- same cert every other PQC path
; on this node already uses, so there is nothing new to provision for this proxy specifically.
cert = /var/lib/p2p/certs-pqc/peer.crt
key  = /var/lib/p2p/certs-pqc/peer.key
; stunnel hardcodes SSL_CTX security level 2 regardless of openssl.cnf -- override here (ML-DSA's
; signature OID isn't in OpenSSL's seclevel strength table, so it is misjudged as "weak" otherwise).
ciphers = DEFAULT@SECLEVEL=0
; X25519MLKEM768 ONLY (2026-10-23 v2): this used to be `X25519MLKEM768:x25519` ("a plain classical client
; can still complete a (non-hybrid) TLS 1.3 handshake here too", R1.2) -- i.e. the `pqkex` port answered a
; classical-only client with a classical X25519 key exchange, the same downgrade already closed on the
; quic-pqc and coap-dtls-pqc ports. Nothing offers x25519 here: the P2P sender, the bare-metal / lighting /
; video clients all offer X25519MLKEM768 alone. A classical client now gets a handshake failure.
curves = X25519MLKEM768

; `pqkex-mutual` (2026-09-27) -- Stack 2, mutual PQC TLS: the ONLY difference from [p2p-pqc] above
; is `verify = 2` + `CAfile` (require + verify a client cert too). A SEPARATE section/port, not a
; flag on [p2p-pqc], so a node that only ever provisioned `pqkex` (no client cert story needed)
; keeps working on :9444 exactly as before -- this is additive, never a behavior change to it.
[p2p-pqc-mutual]
accept = 9447
connect = 127.0.0.1:8453
cert = /var/lib/p2p/certs-pqc/peer.crt
key  = /var/lib/p2p/certs-pqc/peer.key
ciphers = DEFAULT@SECLEVEL=0
curves = X25519MLKEM768
; require AND verify the client's own cert against the SAME CA every peer.crt here chains to --
; the one thing [p2p-pqc] deliberately does not do.
verify = 2
CAfile = /var/lib/p2p/certs-pqc/ca.crt

; `hybrid` (2026-10-02) -- the "PQ-KEX only" stage for the HTTP family: the SAME hybrid X25519MLKEM768
; key exchange as [p2p-pqc], but the node's CLASSICAL fleet leaf instead of the ML-DSA one, so the
; benchmark can price the post-quantum key exchange apart from post-quantum authentication. Two more
; sections in front of the same plaintext :8442 backend; nothing above changes. `curves` offers the
; hybrid group ONLY (no x25519 fallback, like [p2p-pqc] since 2026-10-23) so a classical client cannot complete a
; handshake here and be mistaken for a hybrid one.
[p2p-hybrid]
accept = 9454
connect = 127.0.0.1:8454
cert = /var/lib/p2p/certs/peer.crt
key  = /var/lib/p2p/certs/peer.key
ciphers = DEFAULT@SECLEVEL=0
curves = X25519MLKEM768

; `hybrid-mutual`: as [p2p-hybrid] plus `verify = 2` against the fleet root.
[p2p-hybrid-mutual]
accept = 9455
connect = 127.0.0.1:8455
cert = /var/lib/p2p/certs/peer.crt
key  = /var/lib/p2p/certs/peer.key
ciphers = DEFAULT@SECLEVEL=0
curves = X25519MLKEM768
verify = 2
CAfile = /var/lib/p2p/certs/ca.crt
